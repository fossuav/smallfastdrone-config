# CI for smallfastdrone-config. Shape follows docs/TESTING.md "CI shape".
#
# Two jobs, split by what they cost. `checks` needs nothing but the repo
# and runs in a couple of minutes, so it is what tells you quickly that a
# change is broken. `e2e` needs the SFD submodule and a SITL built from
# it, which is minutes of compilation, so it is cached hard and kept
# separate rather than made a prerequisite — a lint error should not wait
# behind a firmware build.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same ref. Not on main:
# every commit there should have a result of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: lint, typecheck, unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # No submodules: nothing here reads the firmware tree. The
      # parameter metadata and the test fixtures are checked in, which is
      # what keeps this job cheap.
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:unit

      # The production build catches what typecheck cannot: a bad import
      # path, a plugin that rejects something, a chunk that fails to
      # resolve. It is the only place the app is built the way it ships.
      - run: bun run build

  e2e:
    name: end-to-end against SITL
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The pinned firmware commit, so the caches below miss exactly when
      # the submodule moves and hit every other time.
      - name: Identify the pinned firmware
        id: sfd
        run: echo "sha=$(git -C vendor/smallfastdrone rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore the SITL build
        id: sitl-cache
        uses: actions/cache@v4
        with:
          path: vendor/smallfastdrone/build
          key: sitl-${{ runner.os }}-${{ steps.sfd.outputs.sha }}

      # Kept even on a build-cache hit: waf still relinks, and a cold
      # ccache turns a two-minute job back into a twenty-minute one.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-sitl-${{ runner.os }}-${{ steps.sfd.outputs.sha }}
          restore-keys: ccache-sitl-${{ runner.os }}-

      # scripts/dev-setup.sh is the source of truth for what a build
      # needs; this is that list, installed rather than checked for.
      - name: Install SITL build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3 python3-pip ccache

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build SITL
        if: steps.sitl-cache.outputs.cache-hit != 'true'
        run: bun run sitl:build

      # --with-deps because a GitHub runner has no browser libraries, and
      # Chromium fails at launch rather than at install without them.
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      # Playwright starts SITL, the WebSocket bridge and Vite itself (see
      # playwright.config.ts), so there is nothing to start here. The
      # specs share one SITL and run serially: they leak FC state into
      # each other by design, and ordering is part of the contract.
      - run: bun run test:e2e

      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
